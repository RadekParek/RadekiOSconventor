name: Build and validate Android APKs
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radek-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Android SDK and licenses
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: platform-tools
      - name: Install pinned platform, build tools, NDK and CMake
        run: python3 tools/ci_run.py sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Configure Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5
      - name: Build native analyzer and run C++ runtime tests
        run: python3 tools/build_native.py
      - name: AddressSanitizer and UndefinedBehaviorSanitizer tests
        run: python3 tools/ci_run.py bash tools/test_sanitized.sh
      - name: Host tests and placeholder/complete-game separation regressions
        run: python3 tools/ci_run.py python3 -m unittest discover -v
      - name: Android unit tests, lint, JNI native build and APK
        run: python3 tools/ci_run.py ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Validate converter application APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/RadekiOSConventor-debug.apk
          python3 -m radek validate artifacts/RadekiOSConventor-debug.apk --package dev.radek.conventor --entry dev.radek.conventor.MainActivity --converter-app > artifacts/validation.json
      - name: Upload RadekiOSConventor APK
        uses: actions/upload-artifact@v6
        with:
          name: RadekiOSConventor-debug.apk
          path: artifacts/RadekiOSConventor-debug.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always() && hashFiles('app/build/reports/**', 'artifacts/validation.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: test-and-validation-reports
          path: |
            app/build/reports/
            artifacts/validation.json
          if-no-files-found: error
