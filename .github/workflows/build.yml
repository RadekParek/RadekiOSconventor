name: Build and validate Android APKs
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radek-build-${{ github.ref }}
  cancel-in-progress: true

# Two independent jobs run in parallel:
#   host-pipeline  - native analyzer, compat-runtime host tests, sanitizers,
#                    Angry Birds probe and the host-side conversions.
#   converter-apk  - Android unit tests, the converter APK and the packaged
#                    game-runtime libraries.
# Nothing is skipped between them; splitting only cuts wall-clock time.
jobs:
  host-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The host CMake build points FETCHCONTENT_SOURCE_DIR_DYNARMIC at this
      # cached pinned checkout (see the shared comment in the converter-apk
      # job); on a cache hit nothing clones the ~full dynarmic history.
      - name: Cache pinned Dynarmic sources
        uses: actions/cache@v6
        with:
          path: .local/dynarmic-fetch
          key: radek-dynarmic-fetch-v1-a2ef15df6d833ab7bc66131a90350637f26dd2d4
      - name: Prepare pinned Dynarmic sources
        run: |
          set -euo pipefail
          src=.local/dynarmic-fetch/dynarmic-src
          pin=a2ef15df6d833ab7bc66131a90350637f26dd2d4
          if [ -d "$src/.git" ] && [ "$(git -C "$src" rev-parse HEAD 2>/dev/null)" = "$pin" ]; then
            echo "Pinned Dynarmic checkout already present at the pinned commit."
          else
            rm -rf .local/dynarmic-fetch
            mkdir -p .local/dynarmic-fetch
            git clone https://github.com/suyu-emu/dynarmic.git "$src"
            git -C "$src" checkout --detach "$pin"
          fi
          git -C "$src" submodule update --init --depth 1 \
            externals/mcl externals/fmt externals/xbyak externals/oaknut externals/robin-map \
            externals/zydis externals/zycore
          # The suyu-emu mcl external ships a placeholder boost/variant.hpp that
          # includes an absolute CPM cache path from the packager's machine; drop
          # it so <boost/variant.hpp> resolves from the vendored Boost headers.
          rm -f "$src/externals/mcl/include/boost/variant.hpp"
      # Reuse the pinned SDK components between runs. On a hit nothing is
      # downloaded; sdkmanager below then finds every package already installed
      # and returns immediately. Keyed by the exact pinned versions, so a version
      # bump simply misses the cache instead of serving a stale SDK.
      - name: Cache pinned Android SDK components
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.2.12479018
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/build-tools/35.0.0
            /usr/local/lib/android/sdk/platforms/android-35
          key: radek-android-sdk-${{ runner.os }}-platform35-bt35.0.0-ndk27.2.12479018-cmake3.22.1
      - name: Android SDK and licenses
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: platform-tools
      - name: Install pinned platform, build tools, NDK and CMake
        run: python3 tools/ci_run.py sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      # The host C++ analyzer, the compat runtime and the sanitizer suites all
      # compile the same sources repeatedly; a compiler cache removes most of
      # that repeat work on later runs. The PATH masquerade routes plain
      # g++/gcc/cc invocations (tools/build_native.py, tools/test_sanitized.sh)
      # through ccache as well. Missing ccache simply disables all of it.
      - name: Prepare compiler cache
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --max-size=2G
            echo "RADEK_USE_CCACHE=1" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
            mkdir -p "$HOME/.ccache-bin"
            for tool in cc c++ gcc g++; do
              ln -sf "$(command -v ccache)" "$HOME/.ccache-bin/$tool"
            done
            echo "$HOME/.ccache-bin" >> "$GITHUB_PATH"
            echo "ccache enabled ($(ccache --version | head -1))"
          else
            echo "ccache unavailable; building without a compiler cache"
          fi
      - name: Cache compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: radek-ccache-${{ runner.os }}-${{ hashFiles('native/CMakeLists.txt', 'app/build.gradle.kts', 'compat-runtime-v1/build.gradle.kts') }}
          restore-keys: |
            radek-ccache-${{ runner.os }}-
      # Install this before every host-test stage. The sanitizer suite imports
      # radek.pipeline, which imports the optional game lifter at module load
      # time; installing it only after the sanitizer step makes CI fail before
      # the later host-test step can install it.
      - name: Install optional host lifter dependency (capstone)
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'capstone==5.0.7'
      - name: Build native analyzer and run C++ runtime tests
        run: python3 tools/build_native.py
      - name: Configure and run CMake compat-runtime-v1 with pinned Dynarmic ARM32 host tests
        run: |
          launcher=""
          if [ "${RADEK_USE_CCACHE:-0}" = "1" ]; then
            launcher="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -S native -B .local/native-cmake -DRADEK_BUILD_COMPAT_RUNTIME=ON -DRADEK_FETCH_DYNARMIC=ON \
            -DFETCHCONTENT_SOURCE_DIR_DYNARMIC="$PWD/.local/dynarmic-fetch/dynarmic-src" $launcher
          cmake --build .local/native-cmake --parallel "$(nproc)"
          ctest --test-dir .local/native-cmake --output-on-failure
      - name: Validate compat-runtime-v1 smoke database
        run: |
          python3 -m unittest discover -s compat-runtime-v1/tests -v
          python3 compat-runtime-v1/tools/smoke_db.py validate
      - name: AddressSanitizer and UndefinedBehaviorSanitizer tests
        run: python3 tools/ci_run.py bash tools/test_sanitized.sh
      # The host static-recompilation plan (radek/plan.py) uses this package
      # to run the game lifter over real inputs. It is installed above, before
      # the sanitizer and host test stages that import the pipeline.
      - name: Host tests and placeholder/complete-game separation regressions
        run: python3 tools/ci_run.py python3 -m unittest discover -v
      - name: Probe Angry Birds game-runtime boot attempt
        run: |
          set -e
          python3 -m radek gameboot tests/data/AngryBirds_v1.0_os30.ipa --authorized --output .local/angrybirds-gameboot
          python3 - <<'EOF'
          import json, sys
          manifest = json.load(open(".local/angrybirds-gameboot/game-runtime-manifest.json"))
          probe = manifest["hostProbe"]
          checks = (
              ("contract is game-runtime-v1", manifest["contract"] == "game-runtime-v1"),
              ("artifact is the game APK name", manifest["artifact"]["name"] == "AngryBirds_v1.0_os30-game.apk"),
              ("thin 32-bit ARM slice staged", manifest["executable"]["format"] == "thin-macho32" and manifest["executable"]["cpuType"] == 12),
              ("boot was probed", probe["status"] == "PROBED"),
              ("imports resolved", probe["loaderStatus"] in ("LOADED", "LOADED_WITH_TRAPS") and probe["unresolvedSymbols"] == 0),
              ("entry point reached", probe["entryPointReached"] is True),
              ("guest instructions executed", probe["instructions"] > 0),
              # The Darwin-only imports are served by the translation layer,
              # never by invented Android exports.
              ("Darwin-only translation layer registered", probe["darwinCompatBoundSymbols"] == 34),
              # The boot must stop at a *documented* boundary: either the first
              # unimplemented import it touches (trap) or one of its bounded
              # execution limits when the guest stays inside its own code. The
              # probe never continues past an unimplemented call and never
              # reports progress it did not make.
              ("stopped at a documented boundary",
               (bool(probe["trappedImport"]) and probe["trapCalls"] == 1)
               or (probe["trapCalls"] == 0 and probe["executionStatus"] in ("INSTRUCTION_LIMIT", "TIME_LIMIT"))
               # Bounded guest-heap exhaustion after the game's own retry loop keeps
               # asking for memory because this host has no GLES driver (every GL call
               # is refused). Accepted only with that exact reason and no trapped import.
               or (probe["trapCalls"] == 0 and not probe["trappedImport"]
                   and probe["executionStatus"] == "MEMORY_FAULT"
                   and "bounded guest heap" in str(probe.get("reason", "")))),
          )
          failed = [label for label, ok in checks if not ok]
          if failed:
              print("::error title=Angry Birds gameboot probe failed::" + "; ".join(failed))
              print(json.dumps({k: probe.get(k) for k in ("status", "loaderStatus", "executionStatus", "instructions", "trappedImport", "trapCalls", "reason")}, indent=2))
              sys.exit(1)
          boundary = probe["trappedImport"] or probe["executionStatus"]
          print(f"Angry Birds boot probe: {probe['instructions']} instructions, stopped at {boundary}")
          EOF
      - name: Translate Angry Birds and validate the game-runtime handoff
        run: |
          set -e
          test -f tests/data/AngryBirds_v1.0_os30.ipa
          set +e
          python3 -m radek convert tests/data/AngryBirds_v1.0_os30.ipa --authorized --output .local/angrybirds-conversion
          code=$?
          set -e
          echo "convert exit code: $code (3 = BLOCKED, the expected honest state)"
          test "$code" -eq 3
          python3 - <<'PY'
          import hashlib, io, json, pathlib, sys, zipfile

          root = pathlib.Path(".local/angrybirds-conversion")
          report_path = root / "report.json"
          if not report_path.is_file():
              print("::error::Angry Birds conversion report.json was not written")
              sys.exit(1)
          report = json.loads(report_path.read_text())
          providers = report.get("compatRegistry") or {}
          translation = report.get("bytecodeTranslation") or {}
          link = report.get("androidLink") or {}
          progress = report.get("portProgress") or {}
          integration = report.get("gameRuntimeIntegration") or {}
          diagnostic = {key: report.get(key) for key in (
              "state", "compatRegistry", "bytecodeTranslation", "androidLink",
              "portProgress", "gameRuntimeIntegration", "completeConversion")}
          handoff_path = root / "bytecode-translation" / "translated-game-runtime-input.zip"
          handoff_valid = False
          if handoff_path.is_file():
              try:
                  with zipfile.ZipFile(handoff_path) as handoff:
                      expected_entries = {
                          "manifest.json", "libtranslated_game.so", "translated-game-payload.zip",
                          "android-link-report.json", "rt_report.json",
                      }
                      entries = handoff.namelist()
                      names = set(entries)
                      manifest = json.loads(handoff.read("manifest.json"))
                      files = manifest.get("files", {})
                      hashes_match = (len(entries) == len(names) and names == expected_entries
                                      and set(files) == expected_entries - {"manifest.json"})
                      if hashes_match:
                          for name, record in files.items():
                              data = handoff.read(name)
                              if (hashlib.sha256(data).hexdigest() != record.get("sha256")
                                      or len(data) != record.get("sizeBytes")):
                                  hashes_match = False
                                  break
                      payload_valid = False
                      if hashes_match:
                          with zipfile.ZipFile(io.BytesIO(handoff.read("translated-game-payload.zip"))) as payload:
                              payload_manifest = json.loads(payload.read("manifest.json"))
                              memory = payload.read("rt_mem.bin")
                              memory_record = payload_manifest.get("memoryImage", {})
                              payload_valid = (
                                  payload.testzip() is None
                                  and set(payload.namelist()) == {"manifest.json", "rt_mem.bin"}
                                  and payload_manifest.get("contract") == "translated-game-payload-v1"
                                  and hashlib.sha256(memory).hexdigest() == memory_record.get("sha256")
                                  and len(memory) == memory_record.get("sizeBytes")
                              )
                      packaged_link = json.loads(handoff.read("android-link-report.json"))
                      packaged_translation = json.loads(handoff.read("rt_report.json"))
                      link_flags = manifest.get("linkVerification", {})
                      verified_flags = (
                          "architectureVerified", "dependenciesVerified", "exportsVerified",
                          "translationEntryPointVerified", "allVerificationsPassed",
                      )
                      handoff_valid = (
                          handoff.testzip() is None and hashes_match and payload_valid
                          and manifest.get("contract") == "translated-game-runtime-input-v1"
                          and manifest.get("targetAbi") == "arm64-v8a"
                          and manifest.get("sourceExecutableSha256") == integration.get("sourceExecutableSha256")
                          and packaged_translation.get("sourceExecutableSha256") == manifest.get("sourceExecutableSha256")
                          and packaged_translation.get("translationEntryPointSymbol") == manifest.get("entryPointSymbol")
                          and manifest.get("entryPointSymbol") == "Java_dev_radek_gameruntime_GameBootActivity_runTranslatedGame"
                          and all(link_flags.get(key) is True for key in verified_flags)
                          and packaged_link.get("status") == "VERIFIED_ANDROID_SHARED_LIBRARY"
                          and all(packaged_link.get(key) is True for key in (*verified_flags, "ndkLinkVerified"))
                      )
              except Exception as error:
                  print("::error::Angry Birds translated handoff validation failed:", error)
          checks = (
              ("complete-game conversion remains BLOCKED", report.get("state") == "BLOCKED"),
              ("fixture has 254 distinct imports", providers.get("totalObservedImports") == 254),
              ("fixture has 181 same-name NDK candidates", providers.get("sameNameNdkCandidateCount") == 181),
              ("fixture same-name NDK provider count is 181", providers.get("sameNameNdkProviderCount") == 181),
              ("0 outstanding guest adapters remain", providers.get("guestRuntimeAdapterCatalogCount") == 0),
              ("73 fixture imports resolve to verified adapter semantics", providers.get("verifiedGuestAdapterCount") == 73),
              ("guest-adapter inventory remains 75 names", providers.get("guestRuntimeAdapterCatalogInventoryCount") == 75),
              ("reviewed NDK catalog remains 1,229 names", providers.get("fullNdkCandidateInventoryCount") == 1229),
              ("portable-C translation has functions and no failed functions",
               translation.get("status") == "GENERATED_PORTABLE_C"
               and translation.get("translatedFunctionCount", 0) > 0
               and translation.get("functionFailures") == 0),
              ("Android ELF architecture/class verified",
               link.get("status") == "VERIFIED_ANDROID_SHARED_LIBRARY"
               and link.get("targetAbi") == "arm64-v8a"
               and link.get("elfArchitecture") == "arm64-v8a"
               and link.get("elfClass") == 64
               and link.get("architectureVerified") is True),
              ("Android dependency policy verified", link.get("dependenciesVerified") is True),
              ("all translated function exports verified",
               link.get("exportsVerified") is True
               and link.get("translatedFunctionCount") == translation.get("translatedFunctionCount")
               and link.get("linkedTranslatedFunctionCount") == translation.get("translatedFunctionCount")),
              ("GameBootActivity JNI entry verified", link.get("translationEntryPointVerified") is True
               and link.get("entryPointSymbol") == "Java_dev_radek_gameruntime_GameBootActivity_runTranslatedGame"),
              ("all Android-link checks passed", link.get("allVerificationsPassed") is True
               and link.get("ndkLinkVerified") is True),
              ("linked byte progress matches the verified translated ELF",
               progress.get("androidLinkVerified") is True
               and progress.get("architectureVerified") is True
               and progress.get("dependenciesVerified") is True
               and progress.get("exportsVerified") is True
               and progress.get("translationEntryPointVerified") is True
               and progress.get("percent") == link.get("androidLinkedTextPercent")
               and progress.get("recompiledTextBytes") == link.get("androidLinkedTextBytes")
               and progress.get("totalTextBytes") == link.get("executableTextBytes")),
              ("hash-bound handoff is ready for the game-runtime APK builder",
               integration.get("status") == "READY_FOR_GAME_RUNTIME_APK"
               and integration.get("readyForGameRuntimeApk") is True
               and integration.get("linkedIntoGame") is False
               and integration.get("apkProduced") is False
               and integration.get("gamePlayable") is False),
              ("handoff ZIP and translated memory payload are valid", handoff_valid),
          )
          failed = [label for label, ok in checks if not ok]
          if failed:
              print("::error title=Angry Birds translated handoff failed::" + "; ".join(failed))
              print(json.dumps(diagnostic, indent=2))
              sys.exit(1)
          print("Angry Birds translated runtime input is verified and ready for APK import; no APK or gameplay is claimed")
          PY
      # The verified Android link exists only on the runner until it is uploaded.
      # This ZIP is what the phone imports ("Import portable-C handoff ZIP") before
      # "Build game APK with translated code", which is what moves progress.
      - name: Collect Angry Birds Android link handoff
        if: always() && hashFiles('.local/angrybirds-conversion/bytecode-translation/translated-game-runtime-input.zip') != ''
        run: |
          mkdir -p artifacts/angrybirds-android-link
          cp .local/angrybirds-conversion/bytecode-translation/translated-game-runtime-input.zip artifacts/angrybirds-android-link/
          cp .local/angrybirds-conversion/bytecode-translation/android-link-report.json artifacts/angrybirds-android-link/ || true
          cp .local/angrybirds-conversion/report.json artifacts/angrybirds-android-link/ || true
      - name: Upload Angry Birds Android link handoff
        if: always() && hashFiles('artifacts/angrybirds-android-link/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: angrybirds-android-link-handoff
          path: artifacts/angrybirds-android-link/
          if-no-files-found: warn
      - name: Convert committed sample IPA with the host CLI
        run: |
          set -e
          test -f tests/data/sample-leaf.ipa
          set +e
          python3 -m radek convert tests/data/sample-leaf.ipa --authorized --output .local/sample-conversion
          code=$?
          set -e
          echo "convert exit code: $code (3 = BLOCKED, the expected honest state)"
          # Surface the report before asserting so any failure is diagnosable.
          test "$code" -eq 3  # BLOCKED: honest state, complete-game conversion unsupported
          test -f .local/sample-conversion/librecompiled-entry.so
          test -f .local/sample-conversion/recompiled-entry.c
          test -f .local/sample-conversion/ioscompat/libioscompat.cpp
          test -f .local/sample-conversion/ioscompat/registry.json
          python3 - <<'EOF'
          import json, pathlib, sys
          path = pathlib.Path(".local/sample-conversion/report.json")
          if not path.is_file():
              print("::error::sample conversion report.json was not written")
              sys.exit(1)
          report = json.load(path.open())
          keys = ("state", "portProgress", "compatRegistry", "experimentalShell",
                  "conversionProgress", "error")
          diagnostic = {k: report.get(k) for k in keys}
          print(json.dumps(diagnostic, indent=2))
          checks = (
              ("state is BLOCKED", report["state"] == "BLOCKED"),
              ("statically recompiled-byte progress > 0", report["portProgress"]["percent"] > 0),
              ("3 verified shims", report["compatRegistry"]["verifiedImplementations"] == 3),
              ("0 stubbed handlers", report["compatRegistry"]["stubbedHandlers"] == 0),
              ("0 unresolved imports", report["compatRegistry"]["unresolvedImports"] == 0),
              ("experimental shell built and labelled",
               report["experimentalShell"]["status"] == "BUILT_NOT_A_GAME"),
              ("shell never claims game conversion",
               report["experimentalShell"].get("completeGameConversion") is False),
              ("complete-game progress stays NOT_BUILT",
               report["conversionProgress"]["status"] == "NOT_BUILT"),
          )
          failed = [label for label, ok in checks if not ok]
          if failed:
              shell = report.get("experimentalShell") or {}
              message = "; ".join(failed) + " | experimentalShell=" + json.dumps(shell)[:1500]
              print("::error title=sample conversion check failed::" + message)
              sys.exit(1)
          print("sample conversion honest-status checks passed")
          EOF
      - name: Validate the labelled experimental shell APK
        run: python3 -m radek validate-shell .local/sample-conversion/experimental-shell.apk
      - name: Convert IPA (hello-test must fully convert end to end)
        run: |
          set -e
          test -f tests/data/hello-test.ipa
          python3 -m radek convert tests/data/hello-test.ipa --authorized --output .local/hello-conversion
          python3 - <<'EOF'
          import json, sys
          report = json.load(open(".local/hello-conversion/report.json"))
          conversion = report["conversionProgress"]
          complete = report["completeConversion"]
          checks = (
              ("state is READY", report["state"] == "READY"),
              ("complete-game progress 100", conversion["percent"] == 100),
              ("complete-game status READY", conversion["status"] == "READY"),
              ("complete conversion status COMPLETE", complete["status"] == "COMPLETE"),
              ("contract complete-game-v1", complete["contract"] == "complete-game-v1"),
              ("completeGameConversion true", complete["completeGameConversion"] is True),
              ("artifact hello-test.apk", complete["artifact"] == "hello-test.apk"),
          )
          failed = [label for label, ok in checks if not ok]
          if failed:
              print("::error title=hello-test conversion failed::" + "; ".join(failed))
              print(json.dumps({"conversionProgress": conversion, "completeConversion": complete}, indent=2))
              sys.exit(1)
          print("hello-test converted end-to-end:", complete["artifact"], "· package", complete["package"])
          EOF
      - name: Validate hello-test converted APK
        run: |
          set -e
          PKG="dev.radek.converted.p$(python3 -c "import hashlib; print(hashlib.sha256(open('tests/data/hello-test.ipa','rb').read()).hexdigest()[:20])")"
          python3 -m radek validate .local/hello-conversion/hello-test.apk \
            --package "$PKG" \
            --entry dev.radek.generated.MainActivity
      - name: Convert IPA (simple.ipa exercises a longer statically recompiled routine)
        run: |
          set -e
          test -f tests/data/simple.ipa
          python3 -m radek convert tests/data/simple.ipa --authorized --output .local/simple-conversion
          python3 - <<'EOF'
          import json, pathlib, sys
          report = json.load(open(".local/simple-conversion/report.json"))
          conversion = report["conversionProgress"]
          complete = report["completeConversion"]
          checks = (
              ("state is READY", report["state"] == "READY"),
              ("complete-game progress 100", conversion["percent"] == 100),
              ("complete conversion status COMPLETE", complete["status"] == "COMPLETE"),
              ("completeGameConversion true", complete["completeGameConversion"] is True),
              ("artifact simple.apk", complete["artifact"] == "simple.apk"),
              ("statically recompiled reachable function count is 1", complete["recompiledReachableFunctions"] == 1),
              ("not statically recompiled reachable function count is 0", complete["notRecompiledReachableFunctions"] == 0),
              ("statically recompiled native entry exists", pathlib.Path(".local/simple-conversion/librecompiled-entry.so").is_file()),
          )
          failed = [label for label, ok in checks if not ok]
          if failed:
              print("::error title=simple IPA conversion failed::" + "; ".join(failed))
              print(json.dumps({"conversionProgress": conversion, "completeConversion": complete}, indent=2))
              sys.exit(1)
          print("simple.ipa converted end-to-end:", complete["artifact"], "· package", complete["package"])
          EOF
      - name: Validate simple converted APK
        run: |
          set -e
          PKG="dev.radek.converted.p$(python3 -c "import hashlib; print(hashlib.sha256(open('tests/data/simple.ipa','rb').read()).hexdigest()[:20])")"
          python3 -m radek validate .local/simple-conversion/simple.apk \
            --package "$PKG" \
            --entry dev.radek.generated.MainActivity
      - name: Collect sample conversion artifacts
        if: always() && hashFiles('.local/sample-conversion/**') != ''
        run: |
          mkdir -p artifacts/sample-conversion
          cp .local/sample-conversion/report.json artifacts/sample-conversion/ || true
          cp .local/sample-conversion/experimental-shell.apk artifacts/sample-conversion/ || true
          cp -r .local/sample-conversion/ioscompat artifacts/sample-conversion/ || true
      - name: Collect hello-test conversion artifacts
        if: always() && hashFiles('.local/hello-conversion/**') != ''
        run: |
          mkdir -p artifacts/hello-conversion
          cp .local/hello-conversion/report.json artifacts/hello-conversion/ || true
          cp .local/hello-conversion/hello-test.apk artifacts/hello-conversion/ || true
      - name: Upload sample conversion artifacts
        if: always() && hashFiles('artifacts/sample-conversion/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: sample-conversion-artifacts
          path: artifacts/sample-conversion/
          if-no-files-found: warn
      - name: Upload hello-test conversion artifacts
        if: always() && hashFiles('artifacts/hello-conversion/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: hello-conversion-artifacts
          path: artifacts/hello-conversion/
          if-no-files-found: warn
      - name: Collect simple conversion artifacts
        if: always() && hashFiles('.local/simple-conversion/**') != ''
        run: |
          mkdir -p artifacts/simple-conversion
          cp .local/simple-conversion/report.json artifacts/simple-conversion/ || true
          cp .local/simple-conversion/simple.apk artifacts/simple-conversion/ || true
      - name: Upload simple conversion artifacts
        if: always() && hashFiles('artifacts/simple-conversion/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: simple-conversion-artifacts
          path: artifacts/simple-conversion/
          if-no-files-found: warn
      - name: Collect Angry Birds gameboot artifacts
        if: always() && hashFiles('.local/angrybirds-gameboot/**') != ''
        run: |
          mkdir -p artifacts/angrybirds-gameboot
          cp .local/angrybirds-gameboot/game-runtime-manifest.json artifacts/angrybirds-gameboot/ || true
          cp .local/angrybirds-gameboot/gameboot-report.json artifacts/angrybirds-gameboot/ || true
      - name: Upload Angry Birds gameboot artifacts
        if: always() && hashFiles('artifacts/angrybirds-gameboot/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: angrybirds-gameboot-artifacts
          path: artifacts/angrybirds-gameboot/
          if-no-files-found: warn

  converter-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Dynarmic is consumed by two CMake builds (the host compat-runtime tests
      # and the Gradle NDK build of compat-runtime-v1). The pinned checkout is
      # prepared once into this cached directory and both consumers are pointed
      # at it through FETCHCONTENT_SOURCE_DIR_DYNARMIC, which bypasses
      # FetchContent's populate subbuild entirely. That matters: a shared
      # FETCHCONTENT_BASE_DIR stores a per-populate CMakeCache, and a second
      # consumer with a different generator (the NDK build uses Ninja, the host
      # build Makefiles) fails with "generator does not match". On a cache hit
      # neither consumer clones the ~full dynarmic history.
      - name: Cache pinned Dynarmic sources
        uses: actions/cache@v6
        with:
          path: .local/dynarmic-fetch
          key: radek-dynarmic-fetch-v1-a2ef15df6d833ab7bc66131a90350637f26dd2d4
      - name: Prepare pinned Dynarmic sources
        run: |
          set -euo pipefail
          src=.local/dynarmic-fetch/dynarmic-src
          pin=a2ef15df6d833ab7bc66131a90350637f26dd2d4
          if [ -d "$src/.git" ] && [ "$(git -C "$src" rev-parse HEAD 2>/dev/null)" = "$pin" ]; then
            echo "Pinned Dynarmic checkout already present at the pinned commit."
          else
            rm -rf .local/dynarmic-fetch
            mkdir -p .local/dynarmic-fetch
            git clone https://github.com/suyu-emu/dynarmic.git "$src"
            git -C "$src" checkout --detach "$pin"
          fi
          git -C "$src" submodule update --init --depth 1 \
            externals/mcl externals/fmt externals/xbyak externals/oaknut externals/robin-map \
            externals/zydis externals/zycore
          # The suyu-emu mcl external ships a placeholder boost/variant.hpp that
          # includes an absolute CPM cache path from the packager's machine; drop
          # it so <boost/variant.hpp> resolves from the vendored Boost headers.
          rm -f "$src/externals/mcl/include/boost/variant.hpp"
          # Point the Gradle NDK build at this checkout (consumed by
          # compat-runtime-v1/build.gradle.kts as FETCHCONTENT_SOURCE_DIR_DYNARMIC).
          echo "RADEK_DYNARMIC_SOURCE_DIR=$PWD/.local/dynarmic-fetch/dynarmic-src" >> "$GITHUB_ENV"
      - name: Cache pinned Android SDK components
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.2.12479018
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/build-tools/35.0.0
            /usr/local/lib/android/sdk/platforms/android-35
          key: radek-android-sdk-${{ runner.os }}-platform35-bt35.0.0-ndk27.2.12479018-cmake3.22.1
      - name: Android SDK and licenses
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: platform-tools
      - name: Install pinned platform, build tools, NDK and CMake
        run: python3 tools/ci_run.py sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      # ccache backs the Gradle NDK build of compat-runtime-v1 when
      # RADEK_USE_CCACHE=1 (see compat-runtime-v1/build.gradle.kts).
      - name: Prepare compiler cache
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --max-size=2G
            echo "RADEK_USE_CCACHE=1" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
            echo "ccache enabled ($(ccache --version | head -1))"
          else
            echo "ccache unavailable; building without a compiler cache"
          fi
      - name: Cache compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: radek-ccache-${{ runner.os }}-${{ hashFiles('native/CMakeLists.txt', 'app/build.gradle.kts', 'compat-runtime-v1/build.gradle.kts') }}
          restore-keys: |
            radek-ccache-${{ runner.os }}-
      - name: Configure Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5
      # The APK validation below runs the radek CLI, which imports the
      # optional game lifter at module load time.
      - name: Install optional host lifter dependency (capstone)
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'capstone==5.0.7'
      - name: Android unit tests, converter APK, and compat-runtime-v1 Android library
        run: python3 tools/ci_run.py ./gradlew --no-daemon :app:testDebugUnitTest :gameruntime-template:testDebugUnitTest :app:lintDebug :app:assembleDebug :compat-runtime-v1:lintDebug :compat-runtime-v1:assembleDebug
      - name: Verify game-runtime shared libraries are packaged in the converter APK
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile

          apk_path = "app/build/outputs/apk/debug/app-debug.apk"
          required = (
              "lib/arm64-v8a/libcompat_runtime_v1.so",
          )
          with ZipFile(apk_path) as apk:
              entries = set(apk.namelist())
          missing = [name for name in required if name not in entries]
          if missing:
              raise SystemExit(f"converter APK is missing game-runtime native dependencies: {missing}")
          print("Converter APK contains:", ", ".join(required))
          PY
      - name: Validate converter application APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/RadekiOSConventor-debug.apk
          python3 -m radek validate artifacts/RadekiOSConventor-debug.apk --package dev.radek.conventor --entry dev.radek.conventor.MainActivity --converter-app > artifacts/validation.json
      - name: Upload RadekiOSConventor APK
        uses: actions/upload-artifact@v6
        with:
          name: RadekiOSConventor-debug.apk
          path: artifacts/RadekiOSConventor-debug.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always() && hashFiles('app/build/reports/**', 'artifacts/validation.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: test-and-validation-reports
          path: |
            app/build/reports/
            artifacts/validation.json
          if-no-files-found: error
